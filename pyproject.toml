[project]
name = "campaign-optimization"
version = "1.0.0"
description = "AI agent for programmatic advertising campaign optimization, built with Amazon Bedrock and Strands Agents SDK"
license = "MIT-0"
requires-python = ">=3.12"
dependencies = [
    # ML pipeline
    "pandas>=2.1.0",
    "xgboost>=2.0.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "joblib>=1.3.0",
    "playwright>=1.58.0",
    # Strands agent SDK
    "strands-agents>=0.1.0",
    "strands-agents-tools>=0.1.0",
    # AgentCore Runtime SDK
    "bedrock-agentcore>=1.6.0",
    # Pinned minimums to resolve Dependabot security alerts on transitive deps
    "aiohttp>=3.14.0",
    "cryptography>=46.0.6",
    "pillow>=12.2.0",
    "mcp>=1.29.0",
    "pyjwt>=2.13.0",
    "soupsieve>=2.9.0",
    "pydantic-settings>=2.14.0",
    "starlette>=1.6.0",
]

[dependency-groups]
dev = [
    "bedrock-agentcore-starter-toolkit>=0.3.3",
    # AWS SDK — needed for SageMaker endpoint invocation and deploy scripts
    "boto3>=1.34.0",
]
